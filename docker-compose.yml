version: '3.8'

services:
  tiendadeperritosdb:
    image: mysql:8.0
    container_name: tiendadeperritosdb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tienda_perritos
    ports:
      - "3306:3306"
    volumes:
      # IE3: Persistencia estricta de datos (Volumen nombrado)
      - tiendadeperritosdata:/var/lib/mysql
      # SOLUCIÓN: Montamos tu init.sql para que se ejecute automáticamente al iniciar
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tiendadeperritosnet

  tiendadeperritosback:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiendadeperritosback
    restart: always
    environment:
      - DB_HOST=tiendadeperritosdb
      - DB_USER=root
      - DB_PASSWORD=admin123
      - DB_NAME=tienda_perritos
      - DB_PORT=3306
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - tiendadeperritosnet
    depends_on:
      - tiendadeperritosdb

  # SOLUCIÓN: ¡Agregamos el Frontend que faltaba para completar la Orquestación (IE2)!
  tiendadeperritosfront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiendadeperritosfront
    restart: always
    ports:
      # Mapeamos el puerto 80 externo (HTTP estándar de AWS) al 8080 interno del Nginx unprivileged
      - "80:8080" 
    networks:
      - tiendadeperritosnet
    depends_on:
      - tiendadeperritosback

# Declaración explícita del volumen y la red (Exigido para que la persistencia sea funcional)
volumes:
  tiendadeperritosdata:

networks:
  tiendadeperritosnet:
    driver: bridge