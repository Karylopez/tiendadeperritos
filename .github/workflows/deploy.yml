name: CI/CD Tienda de Perritos (AWS ECR & EC2)

on:
  push:
    branches:
      - deploy # Se activa estrictamente al hacer push a la rama deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

    - name: Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Compilar, etiquetar y subir imagen del Backend a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tiendadeperritosback # Reemplaza con el nombre de tu repositorio ECR si es diferente
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Compilar, etiquetar y subir imagen del Frontend a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tiendadeperritosfront # Reemplaza con el nombre de tu repositorio ECR si es diferente
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código (para transferir compose y sql)
      uses: actions/checkout@v3

    - name: Desplegar en la instancia AWS EC2 vía SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Crear carpeta para el proyecto si no existe
          mkdir -p ~/tienda-perritos
          cd ~/tienda-perritos

          # 2. Instalar AWS CLI y Docker si no estuvieran (por seguridad)
          if ! command -v aws &> /dev/null; then sudo apt-get update && sudo apt-get install -y awscli; fi

          # 3. Autenticar Docker de la EC2 con AWS ECR
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          # 4. Crear el archivo docker-compose de producción dinámicamente en la EC2
          cat << 'EOF' > docker-compose.yml
          version: '3.8'
          services:
            tiendadeperritosdb:
              image: mysql:8.0
              container_name: tiendadeperritosdb
              restart: always
              environment:
                MYSQL_ROOT_PASSWORD: admin123
                MYSQL_DATABASE: tienda_perritos
              ports:
                - "3306:3306"
              volumes:
                - tiendadeperritosdata:/var/lib/mysql
                - ./init.sql:/docker-entrypoint-initdb.d/init.sql
              networks:
                - tiendadeperritosnet

            tiendadeperritosback:
              image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/tiendadeperritosback:latest
              container_name: tiendadeperritosback
              restart: always
              environment:
                - DB_HOST=tiendadeperritosdb
                - DB_USER=root
                - DB_PASSWORD=admin123
                - DB_NAME=tienda_perritos
                - DB_PORT=3306
                - PORT=3001
              ports:
                - "3001:3001"
              networks:
                - tiendadeperritosnet
              depends_on:
                - tiendadeperritosdb

            tiendadeperritosfront:
              image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/tiendadeperritosfront:latest
              container_name: tiendadeperritosfront
              restart: always
              ports:
                - "80:8080"
              networks:
                - tiendadeperritosnet
              depends_on:
                - tiendadeperritosback

          volumes:
            tiendadeperritosdata:

          networks:
            tiendadeperritosnet:
              driver: bridge
          EOF

          # 5. Escribir el archivo init.sql en el servidor
          cat << 'EOF' > init.sql
          CREATE DATABASE IF NOT EXISTS tienda_perritos;
          USE tienda_perritos;
          CREATE TABLE IF NOT EXISTS productos (
              id INT AUTO_INCREMENT PRIMARY KEY,
              nombre VARCHAR(255) NOT NULL,
              descripcion TEXT,
              precio DECIMAL(10,2) NOT NULL,
              stock INT NOT NULL
          );
          INSERT INTO productos (nombre, descripcion, precio, stock) VALUES 
          ('Alimento Premium Perritos Adultos', 'Saco de 15kg con alta proteína', 34990.00, 20),
          ('Juguete Hueso Interactivo', 'Goma ultra resistente para morder', 8990.00, 50),
          ('Plato de Acero Inoxidable', 'Base antideslizante mediana', 5990.00, 15)
          ON DUPLICATE KEY UPDATE nombre=nombre;
          EOF

          # 6. Detener contenedores antiguos, descargar nuevas imágenes de ECR y levantar todo
          docker compose down
          docker compose pull
          docker compose up -d