server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Redirige las peticiones /api/ hacia el contenedor del backend
    location /api/ {
        proxy_pass http://tiendadeperritosback:3001/api/;
    }
}